# Cadeia de suprimentos do núcleo (SEC-SUP-1, docs/14 B5): fontes permitidas, licenças compatíveis
# com uso comercial e alertas de segurança conhecidos.

[graph]
all-features = false

[advisories]
# Alertas do RustSec. Exceção só com motivo, data e responsável, registrada em docs/decisoes.md.
ignore = [
  # rsa (Marvin): afeta operações com chave PRIVADA RSA (decifrar/assinar) por canal de tempo. O núcleo
  # só VERIFICA assinatura do ID token com a chave pública do Keycloak (openidconnect); não há chave
  # privada RSA no processo. Sem versão corrigida publicada. Revisar a cada atualização do
  # openidconnect. DEC-2026-11-08-47.
  { id = "RUSTSEC-2023-0071", reason = "só verificação com chave pública; sem correção publicada" },
  # astral-tokio-tar sem manutenção: entra só como dependência de TESTE (testcontainers) e não vai
  # para o binário. DEC-2026-11-08-47.
  { id = "RUSTSEC-2026-0440", reason = "dependência só de teste (testcontainers)" },
]

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD",
]
confidence-threshold = 0.9
# O próprio VidaCor é proprietário (licença do workspace).
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-api"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-comum"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-dominio-recepcao"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-dominio-triagem"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-dominio-laudo"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-dominio-faturamento"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
