# Cadeia de suprimentos do núcleo (SEC-SUP-1, docs/14 B5): fontes permitidas, licenças compatíveis
# com uso comercial e alertas de segurança conhecidos.

[graph]
all-features = false

[advisories]
# Alertas do RustSec. Exceção só com motivo, data e responsável, registrada em docs/decisoes.md.
ignore = []

[licenses]
allow = [
  "MIT", "Apache-2.0", "Apache-2.0 WITH LLVM-exception", "BSD-2-Clause", "BSD-3-Clause",
  "ISC", "Unicode-3.0", "Zlib", "CC0-1.0", "MPL-2.0", "CDLA-Permissive-2.0", "0BSD",
]
confidence-threshold = 0.9
# O próprio VidaCor é proprietário (licença do workspace).
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-api"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-comum"
[[licenses.exceptions]]
allow = ["LicenseRef-VidaCor-Proprietario"]
crate = "vidacor-dominio-recepcao"

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
