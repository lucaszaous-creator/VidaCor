# CI do VidaCor (docs/11 § 9.4, SEC-SUP-1 a 3). Actions fixadas por SHA de commit; token só leitura;
# nenhum pull_request_target; nenhum segredo usado nesta esteira.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  nucleo:
    name: Núcleo Rust (fmt, clippy, testes G4 com PostgreSQL e Orthanc reais)
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    env:
      SQLX_OFFLINE: "true"
      CARGO_TERM_COLOR: always
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Toolchain do rust-toolchain.toml
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@f13886b937689c021905a6b90929199931d60db1 # v2.8.1
      - name: Formatação
        run: cargo fmt --all -- --check
      - name: Clippy sem avisos
        run: cargo clippy --workspace --all-targets -- -D warnings
      - name: Testes (unidade e integração com Testcontainers)
        run: cargo test --workspace
      - name: Cadeia de suprimentos (cargo-deny, SEC-SUP-1)
        run: |
          cargo install cargo-deny --locked --version 0.20.2
          cargo deny check
      - name: Contrato OpenAPI atualizado
        run: |
          cargo run -q -p vidacor-api -- --openapi > /tmp/openapi.json
          diff -u packages/api-client/openapi.json /tmp/openapi.json

  telas:
    name: Telas (lint, tipos, testes, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@41ff72655975bd51cab0327fa583b6e92b6d3061 # v4.2.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm -r --if-present lint
      - run: pnpm -r --if-present typecheck
      - run: pnpm -r --if-present test
      - run: pnpm -r --if-present build
      - name: A tela cabe na janela (1440x900 e 1280x800, docs/05)
        run: |
          pnpm --filter @vidacor/web exec playwright install --with-deps chromium
          pnpm --filter @vidacor/web test:telas
