<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:#0A1A4A;font-family:Inter,system-ui,sans-serif;color:#0F172A}
.scene{position:absolute;inset:0;opacity:0}

.chip{display:inline-flex;align-items:center;gap:10px;height:44px;padding:0 20px;border-radius:999px;font-weight:700;font-size:22px}
.ok{background:#E5F5EC;color:#1F7A4D}.amber{background:#FFF3DF;color:#9A5B00}.blue{background:#E8F2FB;color:#0C72B0}
.kicker{font-size:24px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#3E9BDB}
.h{font-size:64px;font-weight:800;letter-spacing:-.03em;line-height:1.05}
.sub{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);max-width:1500px;text-align:center;font-size:34px;font-weight:600;color:#fff;background:rgba(6,15,46,.78);padding:14px 30px;border-radius:18px;line-height:1.3;z-index:50}
.plate{width:300px;height:96px;border-radius:10px;background:#fff;border:4px solid #1B1F2A;overflow:hidden;position:relative;font-family:'Inter';box-shadow:0 6px 18px rgba(0,0,0,.25)}
.plate .band{height:24px;background:#003399;color:#fff;font-size:15px;font-weight:800;letter-spacing:.3em;display:flex;align-items:center;justify-content:center}
.plate .num{font-size:52px;font-weight:800;letter-spacing:.06em;text-align:center;line-height:64px;color:#111}
.phone{width:520px;height:960px;border-radius:64px;background:#0B1020;padding:18px;box-shadow:0 30px 80px rgba(0,0,0,.45)}
.screen{width:100%;height:100%;border-radius:48px;background:#ECE5DD;overflow:hidden;display:flex;flex-direction:column}
.bubble{max-width:82%;padding:18px 22px;border-radius:22px;font-size:25px;line-height:1.35;box-shadow:0 1px 1px rgba(0,0,0,.08)}
.in{background:#fff;align-self:flex-start;border-top-left-radius:6px}
.out{background:#D8FDD2;align-self:flex-end;border-top-right-radius:6px}
.small{font-size:18px;color:#5B6474}
</style></head>
<body>
<div id="root"></div>
<div class="sub" id="sub"></div>

const root=document.getElementById('root');
const $=(h)=>{const d=document.createElement('div');d.innerHTML=h.trim();return d.firstChild};
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2};
const lerp=(a,b,x)=>a+(b-a)*x;

<path d="M30 150 C30 120 50 108 90 104 L150 96 C180 60 215 44 270 44 L330 44 C370 44 400 62 428 96 L470 104 C495 110 505 126 505 150 L505 166 L30 166 Z" fill="url(#${gid})"/>
<path d="M168 98 C192 68 220 58 266 58 L300 58 L300 98 Z" fill="#CFE6F7"/><path d="M314 58 L330 58 C360 58 384 72 405 98 L314 98 Z" fill="#CFE6F7"/>
<rect x="40" y="128" width="40" height="12" rx="6" fill="#FFE8A3"/><rect x="474" y="126" width="26" height="14" rx="6" fill="#E05A4E"/>

 ['entrada','O sistema reconhece o paciente, registra o horário e abre a cancela.'],
 ['recepcao','Na recepção, o check-in já mostra o seu veículo, e o estacionamento é validado junto com o exame.'],
 ['tempo','Enquanto você é atendido, o tempo de permanência é contado automaticamente.'],

];
let TOTAL=60, LEAD=0.4, TAIL=2.2; // seconds; TOTAL set from audio duration
let T=[]; // [{scene,cap,a,b}]
function build(total){TOTAL=total;const w=SEG.map(s=>s[1].length+18);const sum=w.reduce((a,b)=>a+b,0);let t=LEAD;T=SEG.map((s,i)=>{const d=(TOTAL-LEAD-TAIL)*w[i]/sum;const o={scene:s[0],cap:s[1],a:t,b:t+d};t+=d;return o});T[T.length-1].b=TOTAL;}
function sceneSpan(id){const xs=T.filter(x=>x.scene===id);return [xs[0].a,xs[xs.length-1].b]}

function render(t){
  // scene opacity with crossfade
  for(const id in S){const [a,b]=sceneSpan(id);const f=0.45;let o=0;if(t>=a-f&&t<=b+f){o=Math.min(clamp((t-(a-f))/f),clamp((b+f-t)/f))}S[id].style.opacity=o;S[id].style.display=o>0?'block':'none'}
  const cur=T.find(x=>t>=x.a&&t<x.b)||T[T.length-1];
  const sub=document.getElementById('sub');sub.textContent=cur.cap;sub.style.opacity=(cur.scene==='end'||cur.scene==='statement')?0:1;
  const p=id=>{const [a,b]=sceneSpan(id);return clamp((t-a)/(b-a))};
  const g=(id)=>document.getElementById(id);
  // intro
  {const k=p('intro');g('introLogo').style.transform=`scale(${lerp(.85,1,ease(k*2))})`;g('introT').style.opacity=clamp(k*3-.6);g('introT').style.transform=`translateY(${lerp(30,0,ease(k*3-.6))}px)`}
  // whats
  {const k=p('whats');['w1','w2','w3','w4','w5'].forEach((id,i)=>{const v=clamp((k-.06-i*.12)*8);g(id).style.opacity=v;g(id).style.transform=`translateY(${(1-v)*20}px)`});const v=clamp((k-.68)*6);g('linkCard').style.opacity=v;g('linkCard').style.transform=`translateX(${(1-ease(v))*80}px)`}
  // entrada
  {const k=p('entrada');const cx=lerp(-600,820,ease(clamp(k/.45)));g('car1').style.left=cx+'px';const scan=clamp((k-.35)/.15);g('beam').style.opacity=k>.3&&k<.62?.5+.5*Math.sin(t*14):0;
   g('ocr').style.opacity=clamp((k-.4)*6);g('scanbox').style.opacity=k<.55?(Math.sin(t*12)>0?1:.2):1;g('scanbox').style.borderColor=k<.55?'#3E9BDB':'#1F7A4D';
   g('ocrOk').style.opacity=clamp((k-.55)*6);const arm=ease(clamp((k-.62)/.12));g('arm').style.transform=`rotate(${-80*arm}deg)`;if(k>.72){g('car1').style.left=lerp(820,2100,ease(clamp((k-.72)/.28)))+'px'}}
  // recepcao
  {const k=p('recepcao');g('rcard').style.opacity=clamp(k*5);g('rcard').style.transform=`translateY(${(1-ease(clamp(k*4)))*40}px)`;g('park').style.opacity=clamp((k-.3)*5);g('valid').style.transform=`scale(${k>.55?1+.06*Math.max(0,Math.sin((k-.55)*20)):0.001})`;g('valid').style.opacity=k>.55?1:0}
  // tempo
  {const k=p('tempo');const m=Math.round(lerp(0,54,ease(clamp(k/.85))));g('clock').textContent=m+' min';g('ring').setAttribute('stroke-dashoffset',1571*(1-m/120))}
  // pagar
  {const k=p('pagar');g('isento').style.opacity=clamp(k*5);g('phone2').style.opacity=clamp((k-.3)*5);g('phone2').style.transform=`translateY(${(1-ease(clamp((k-.3)*4)))*120}px) scale(.70)`;['p1','p2','p3'].forEach((id,i)=>g(id).style.opacity=clamp((k-.38-i*.14)*7));g('caixaTag').style.opacity=clamp((k-.8)*6)}
  // saida
  {const k=p('saida');g('car2').style.left=lerp(-560,340,ease(clamp(k/.3)))+'px';g('sumCard').style.opacity=clamp((k-.25)*6);g('libOk').style.opacity=clamp((k-.45)*8);const arm=ease(clamp((k-.45)/.12));g('arm2').style.transform=`rotate(${-80*arm}deg)`;if(k>.6)g('car2').style.left=lerp(340,2100,ease(clamp((k-.6)/.4)))+'px'}
  // statement
  {const k=p('statement');[...document.querySelectorAll('#stm .w')].forEach((el,i)=>{const v=clamp((k-i*.22)*5);el.style.opacity=v;el.style.transform=`translateY(${(1-ease(v))*40}px)`})}
  // gestao
  {const k=p('gestao');const v=ease(clamp(k*2));g('k1').textContent=Math.round(18*v);g('kb1').style.width=(45*v)+'%';g('k2').textContent=Math.round(54*v);g('k3').textContent=Math.round(184*v);[...spark.children].forEach((b,i)=>b.style.height=(10+ (20+((i*37)%60))*v)+'%');[...document.querySelectorAll('#kpis .card')].forEach((c,i)=>{const w=clamp((k-i*.08)*6);c.style.opacity=w;c.style.transform=`translateY(${(1-ease(w))*40}px)`})}
  // end
  {const k=p('end');g('endLogo').style.transform=`scale(${lerp(.9,1,ease(k*3))})`;g('endT').style.opacity=clamp(k*3-.5)}
}
function buildFixed(starts,total){TOTAL=total;T=SEG.map((x,i)=>({scene:x[0],cap:x[1],a:starts[i],b:i+1<starts.length?starts[i+1]:total}));}
window.__buildFixed=buildFixed;window.__build=build;window.__render=render;
</script></body></html>
