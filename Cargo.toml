[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
rust-version = "1.85"
license = "LicenseRef-VidaCor-Proprietario"
publish = false

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
dbg_macro = "deny"
todo = "deny"

# Build de desenvolvimento e testes: só a linha no backtrace e nada de depuração das dependências.
# Cada arquivo de teste vira um binário; com depuração completa o disco da estação enche.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
