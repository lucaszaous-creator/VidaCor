[package]
name = "vidacor-api"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true
description = "Núcleo VidaCor: API HTTP (axum), adaptadores PostgreSQL e Orthanc, outbox"

[[bin]]
name = "vidacor-api"
path = "src/main.rs"

[dependencies]
vidacor-comum = { path = "../comum" }
vidacor-dominio-recepcao = { path = "../dominio-recepcao" }
vidacor-dominio-triagem = { path = "../dominio-triagem" }
vidacor-dominio-laudo = { path = "../dominio-laudo" }
vidacor-dominio-faturamento = { path = "../dominio-faturamento" }
vidacor-documentos = { path = "../documentos" }
anyhow = "1.0.100"
axum = { version = "0.8.9", features = ["macros"] }
base64 = "0.22.1"
chrono = { version = "0.4.42", default-features = false, features = ["std", "serde", "clock"] }
chrono-tz = "0.10.4"
futures-util = "0.3.32"
rand = "0.9.2"
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
subtle = "2.6"
sqlx = { version = "0.9.0", default-features = false, features = ["runtime-tokio", "tls-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
thiserror = "2.0.17"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower = "0.5.2"
tower-http = { version = "0.6.6", features = ["limit", "timeout", "trace", "set-header"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
utoipa = { version = "5.4.0", features = ["axum_extras", "uuid", "chrono"] }
uuid = { version = "1.18.1", features = ["v7", "serde"] }
openidconnect = { version = "4", default-features = false, features = ["reqwest", "rustls-tls"] }
hmac = "0.12"
argon2 = { version = "0.5.3", features = ["std"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1", "tokio1-rustls-tls", "hostname"] }

[dev-dependencies]
http-body-util = "0.1.3"
testcontainers-modules = { version = "0.15.0", features = ["postgres", "blocking"] }

[lints]
workspace = true
