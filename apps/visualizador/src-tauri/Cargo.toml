[package]
name = "vidacor-visualizador-app"
version = "0.2.0"
edition.workspace = true
# Tauri 2.12 exige Rust 1.90 (o toolchain fixado é 1.97).
rust-version = "1.90"
license.workspace = true
publish.workspace = true
description = "Visualizador VidaCor (docs/31): programa Tauri para Windows que abre exames DICOM e exporta PDF e JPEG para o paciente"

[lib]
name = "vidacor_visualizador_app"
path = "src/lib.rs"

[[bin]]
name = "visualizador-vidacor"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
gethostname = "=1.1.0"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.10.9"
tauri = { version = "=2.12.5", features = [] }
tauri-plugin-dialog = "=2.8.4"
thiserror = "2.0.17"
vidacor-documentos = { path = "../../../crates/documentos" }
vidacor-visualizador = { path = "../../../crates/visualizador" }

[lints]
workspace = true
